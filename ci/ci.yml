name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,yaml]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Benchmark checksum gate (no timing thresholds)
        run: frictionlab bench --size small --repeat 1 --warmup 0 --compare benchmarks/baseline_small.json
      - name: Validate example configs
        shell: bash
        run: |
          set -euo pipefail
          for cfg in examples/configs/*.json; do
            python -m frictionlab validate "$cfg"
          done

  docs:
    name: docs (build + link check, no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Build docs site
        run: frictionlab docs build --out _site
      - name: Link check (internal links and anchors, no external URLs, no network)
        run: frictionlab docs check _site

  numba:
    name: order book oracle (numba, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      FRICTIONLAB_NUMBA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with numba
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" numba
      - name: Order book oracle tests
        run: python -m pytest -q tests/test_order_book_equivalence.py tests/test_order_book.py
